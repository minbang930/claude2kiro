name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build main binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o claude2kiro-windows-amd64.exe .

      - name: Build launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o claude2kiro-launcher-windows-amd64.exe ./cmd/launcher

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: claude2kiro-windows-amd64
          path: |
            claude2kiro-windows-amd64.exe
            claude2kiro-launcher-windows-amd64.exe
          if-no-files-found: error
